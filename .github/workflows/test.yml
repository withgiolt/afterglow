name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18"
          rebar3-version: "3.27"
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      # tools/env.sh finds Binaryen under ~/.local/opt.
      - name: Install Binaryen
        run: |
          mkdir -p ~/.local/opt
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar -xz -C ~/.local/opt
      - run: bun install --frozen-lockfile
      - run: just test-all
