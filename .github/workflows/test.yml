name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Each OTP release can change the bytecode erlc emits, and afterglow compiles both
    # the app and the OTP stdlib it is built with, so every supported OTP runs the suite.
    # master shows new opcodes before they reach a release; it may fail without
    # failing the run.
    strategy:
      fail-fast: false
      matrix:
        otp: ["28", "29"]
        include:
          - otp: master
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    name: test (OTP ${{ matrix.otp }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.19"
          rebar3-version: "3.27"
      # tools/do/p5-test.mjs uses Node's global WebSocket (Node 22 and later).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      # tools/env.sh finds Binaryen under ~/.local/opt. Keep it on the version the giolt CLI
      # installs for users (binaryen_version in its afterglow.gleam).
      - name: Install Binaryen
        run: |
          mkdir -p ~/.local/opt
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | tar -xz -C ~/.local/opt
      - run: cargo clippy --all-targets -- -D warnings
      - run: bun install --frozen-lockfile
      - run: just test-all
      # Timings on a shared runner are noisy, so the benchmark never fails the run, and
      # one leg is enough to put the table in the job summary.
      - name: Compute benchmarks
        if: matrix.otp == '28'
        continue-on-error: true
        run: just bench-compute >> "$GITHUB_STEP_SUMMARY"

  # One job per web framework fixture (fixtures/<framework>): the app is built with Gleam
  # and each route is compared with erl, so a framework is only listed as working while
  # this job passes. OTP 28 only: the matrix above already covers the OTP versions.
  wisp:
    runs-on: ubuntu-24.04
    name: wisp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
          rebar3-version: "3.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Keep this in step with the Binaryen install in the test job.
      - name: Install Binaryen
        run: |
          mkdir -p ~/.local/opt
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | tar -xz -C ~/.local/opt
      - run: cd fixtures/wisp && gleam build
      - run: tools/wisp-fixture.sh
